<!DOCTYPE html>
<html>
<head>
    <title>Buka Lokasi</title>
    <script type="text/javascript">
        window.onload = function() {
            // Dapatkan nilai koordinat lat & lng dari URL semasa
            var urlParams = new URLSearchParams(window.location.search);
            var lat = urlParams.get('lat');
            var lng = urlParams.get('lng');
            
            // Jika tiada koordinat (contoh: link rosak), buka Play Store biasa
            if (!lat || !lng) {
                window.location.replace("https://play.google.com/store/apps/details?id=com.pedomanmemancing");
                return;
            }

            // Bina pautan 'intent' khas untuk Android Chrome
            var intentUrl = "intent://gogo77-creator.github.io/pedoman-memancing/lokasi.html?lat=" + lat + "&lng=" + lng + "#Intent;scheme=https;package=com.pedomanmemancing;end;";
            
            // Cuba buka aplikasi. Jika aplikasi tiada, Chrome secara automatik 
            // akan redirect pengguna ke halaman Play Store com.pedomanmemancing
            window.location.replace(intentUrl);
        };
    </script>
</head>
<body>
    <p>Sedang membuka lokasi di aplikasi Pedoman Memancing...</p>
</body>
</html>
