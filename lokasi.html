<!DOCTYPE html>
<html>
<head>
    <title>Buka Aplikasi</title>
    <script type="text/javascript">
        window.onload = function() {
            // URL aplikasi anda di Google Play Store
            var playStoreUrl = "https://play.google.com/store/apps/details?id=com.pedomanmemancing";
            
            // Redirect pengguna ke Play Store apabila browser membuka pautan ini
            window.location.replace(playStoreUrl);
        };
    </script>
</head>
<body>
    <p>Membuka Google Play Store...</p>
</body>
</html>
