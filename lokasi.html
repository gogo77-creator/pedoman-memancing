<!DOCTYPE html>
<html>
<head>
    <title>Buka Lokasi</title>
    <script type="text/javascript">
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var lat = urlParams.get('lat');
            var lng = urlParams.get('lng');
            var name = urlParams.get('name') || "Lokasi Dikongsi"; // Ambil nama jika ada
            
            if (!lat || !lng) {
                window.location.replace("https://play.google.com/store/apps/details?id=com.pedomanmemancing");
                return;
            }

            // Masukkan &name= ke dalam intentUrl
            var intentUrl = "intent://gogo77-creator.github.io/pedoman-memancing/lokasi.html?lat=" + lat + "&lng=" + lng + "&name=" + encodeURIComponent(name) + "#Intent;scheme=https;package=com.pedomanmemancing;end;";
            
            window.location.replace(intentUrl);
        };
    </script>
</head>
<body>
    <p>Sedang membuka lokasi di aplikasi Pedoman Memancing...</p>
</body>
</html>
